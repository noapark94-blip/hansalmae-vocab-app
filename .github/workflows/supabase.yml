name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-main
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: qlcgoqcuaenveargxcsa
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deploy secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy API Edge Function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy school vocabulary Edge Function
        run: supabase functions deploy school-vocab --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy feature state Edge Function
        run: supabase functions deploy feature-state --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
