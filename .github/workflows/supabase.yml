name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-main
  cancel-in-progress: true

env:
  # Project ref is not a secret and is safe to keep in the workflow.
  SUPABASE_PROJECT_REF: mzkdwzqjyquucvsgflwo
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          SIGNUP_CODE: ${{ secrets.SIGNUP_CODE }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD ADMIN_CODE SIGNUP_CODE; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is not configured in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy API Edge Function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy school vocabulary Edge Function
        run: supabase functions deploy school-vocab --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Sync application secrets
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          SIGNUP_CODE: ${{ secrets.SIGNUP_CODE }}
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            ADMIN_CODE="$ADMIN_CODE" \
            SIGNUP_CODE="$SIGNUP_CODE"
