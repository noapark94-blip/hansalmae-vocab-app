<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><title>모바일 화면 확인</title><style>body{margin:0;background:#e9e9ed;font:14px system-ui;text-align:center}header{height:52px;display:flex;align-items:center;justify-content:center;gap:12px}button{padding:8px 16px;background:white;border:1px solid #ccc;border-radius:8px;cursor:pointer}iframe{display:block;margin:0 auto;border:1px solid #bbb;border-radius:18px;background:white;width:393px;height:852px;max-width:100%}</style><header><strong>모바일 화면 확인</strong><button data-width="393" data-height="852">393 × 852</button><button data-width="430" data-height="860">430 × 860</button><button data-width="375" data-height="812">375 × 812</button></header><iframe id="app" title="한살매 보카 모바일 화면" src="./index.html"></iframe><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const f=document.getElementById("app");f.style.width=b.dataset.width+"px";f.style.height=b.dataset.height+"px";});</script></html>
